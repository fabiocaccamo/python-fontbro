name: Update data

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *" # run once a month

jobs:
  resources:
    name: Update resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-data.txt
          pip install -r requirements-test.txt

      - name: Update data
        run: |
          python scripts/update_data.py

      - name: Run pre-commit
        continue-on-error: true
        run: |
          pre-commit run --files fontbro/data/unicode-blocks.json fontbro/data/unicode-scripts.json

      - name: Check data changes
        id: data
        run: |
          if git diff --quiet -- fontbro/data/unicode-blocks.json fontbro/data/unicode-scripts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update fonttools requirement
        if: steps.data.outputs.changed == 'true'
        id: fonttools
        run: |
          FONTTOOLS_VERSION=$(python -c "import fontTools; print(fontTools.version)")
          sed -i -E "s/^(fonttools\[[^]]*\] == ).*/\1${FONTTOOLS_VERSION}/" requirements.txt
          echo "version=${FONTTOOLS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.data.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.WORKFLOWS_UPDATE_DATA_TOKEN }}
          add-paths: |
            fontbro/data/unicode-blocks.json
            fontbro/data/unicode-scripts.json
            requirements.txt
          branch: update-data
          delete-branch: true
          commit-message: "Update `unicode-blocks.json` and `unicode-scripts.json` data."
          title: "Update `unicode-blocks.json` and `unicode-scripts.json` data."
          body: |
            Update `unicode-blocks.json` and `unicode-scripts.json` data generated with `fonttools == ${{ steps.fonttools.outputs.version }}` (also updated in `requirements.txt`).
          author: "Fabio Caccamo [bot] <fabio.caccamo@gmail.com>"
          committer: "Fabio Caccamo [bot] <fabio.caccamo@gmail.com>"
